name: Build Aerial TV Traditional Chinese APK

on:
  push:
    branches: [feat/traditional-chinese-no-updater, feat/aerial-tv-performance-r1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build Android TV APK
        working-directory: tv-home/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist
          find tv-home/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/aerial-tv-zh-tw.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: aerial-tv-zh-tw-apk
          path: dist/aerial-tv-zh-tw.apk
          if-no-files-found: error
